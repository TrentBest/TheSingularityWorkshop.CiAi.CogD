name: CogD policy contract

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build policy contract
        run: dotnet build src/CiAi.CogD/CiAi.CogD.csproj --configuration Release
      - name: Run offline policy checks
        run: dotnet run --project tests/CiAi.CogD.Tests/CiAi.CogD.Tests.csproj --configuration Release
